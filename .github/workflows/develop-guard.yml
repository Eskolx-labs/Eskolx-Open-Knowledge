name: develop-guard

on:
  push:
    branches:
      - develop
      - participants/**

permissions:
  contents: read

jobs:
  locked-paths-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect locked-path changes
        run: |
          set -e
          LOCKED='.obsidian/ 90 Templates/ scripts/ *.py *.sh *.js **/cache.json **/.env* *.key *.pem'
          # base: develop for subbranches, main for develop itself
          if git show-ref --verify -q refs/remotes/origin/develop; then
            base=$(git merge-base origin/develop HEAD || echo "$(git rev-parse HEAD~1)")
          else
            base=$(git merge-base origin/main HEAD || echo "$(git rev-parse HEAD~1)")
          fi
          changed=$(git diff --name-only --diff-filter=ACDMR "$base"..HEAD || true)
          hit=""
          for f in $changed; do
            for glob in $LOCKED; do
              case "$f" in
                $glob) hit="$f"; break;;
              esac
            done
            [ -n "$hit" ] && break
          done
          if [ -n "$hit" ]; then
            echo "::error::Locked path changed: $hit"
            echo "The executable surface is only changed by merge-holders via main."
            echo "::error::Owners: review and revert $hit."
            exit 1
          fi
          echo "locked-path check passed"

      - name: Secret scan (added lines only)
        run: |
          set -e
          if git show-ref --verify -q refs/remotes/origin/develop; then
            base=$(git merge-base origin/develop HEAD || true)
          else
            base=$(git merge-base origin/main HEAD || true)
          fi
          diff=$(git diff "$base"..HEAD || true)
          if grep -E '^\+' <<< "$diff" | grep -vE '^\+\+\+' | grep -qE -i \
            '(password|passwd|api[_-]?key|secret|token)[[:space:]]*[:=][[:space:]]*[^[:space:]]|BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}'; then
            echo "::error::Possible secret in pushed content. Owners: rotate and remove."
            exit 1
          fi
          echo "secret scan passed"
